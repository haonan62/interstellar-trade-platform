# /etc/nginx/sites-available/interstellar-trade  (included inside nginx's http {} block)
#
# Install (see deploy/RUNBOOK.md for the full, ordered procedure):
#   1. install deploy/nginx-http-bootstrap.conf first and obtain a certificate,
#   2. then replace it with this file, set the domain, `sudo nginx -t`, reload.
# Replace every occurrence of "yourdomain.com" with your domain.
#
# Security headers (CSP, nosniff, frame-ancestors, Referrer-Policy, ...) are set
# by the application itself on every response, so they cannot be lost to nginx's
# add_header inheritance rules. nginx only adds HSTS.

# ── Rate-limit zones (http context) ──────────────────────────────────────────
# api:  generous, the SPA fires ~6 requests per screen refresh (10 r/s sustained,
#       bursts of 100).
# auth: credential endpoints only (login, bootstrap, password reset): brute-force
#       protection per client IP. Per-ACCOUNT lockout is enforced by the app.
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Request id handed to the app (logs + audit) and echoed to the client.
map $http_x_request_id $itp_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# ── Upstream (must live in http context, NOT inside server {}) ───────────────
upstream trade_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── Redirect plain HTTP → HTTPS ──────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — main site ────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # Start at 300 s; raise to 31536000 once everything works over HTTPS.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 1m;

    # ── Proxy settings (inherited by every location below) ───────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    # $http_host keeps the port, so the browser's Origin header matches Host
    # (the app's CSRF check compares them).
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $itp_request_id;
    proxy_set_header Traceparent       $http_traceparent;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Credential endpoints: strict per-IP limit ────────────────────────────
    # Exact matches: /auth/me and /auth/logout are NOT here, so normal use of
    # the SPA is never throttled by the login limit.
    location = /api/v1/auth/login          { limit_req zone=auth burst=5 nodelay; limit_req_status 429; proxy_pass http://trade_backend; }
    location = /api/v1/auth/bootstrap      { limit_req zone=auth burst=5 nodelay; limit_req_status 429; proxy_pass http://trade_backend; }
    location = /api/v1/auth/reset-password { limit_req zone=auth burst=5 nodelay; limit_req_status 429; proxy_pass http://trade_backend; }

    # ── Relay import carries signed bundles (the app allows 8 MiB) ───────────
    location = /api/v1/relay/import {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 8m;
        proxy_pass http://trade_backend;
    }

    # ── All other API endpoints ──────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://trade_backend;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    # The Go binary serves the built assets (and their Cache-Control headers).
    location / {
        proxy_pass http://trade_backend;
    }

    # /metrics is deliberately not proxied: it is served on a separate internal
    # listener (METRICS_ADDR) that is never published.

    # ── Block dot-files ──────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/interstellar-trade.access.log combined;
    error_log  /var/log/nginx/interstellar-trade.error.log warn;
}

