# Step 1 of the TLS setup: HTTP only, just enough to obtain a certificate.
# (deploy/nginx.conf references certificate files that do not exist yet, so
# nginx would refuse to start with it until certbot has run.)
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx-http-bootstrap.conf /etc/nginx/sites-available/interstellar-trade
#   sudo ln -sf /etc/nginx/sites-available/interstellar-trade /etc/nginx/sites-enabled/interstellar-trade
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d yourdomain.com \
#        --deploy-hook "systemctl reload nginx"
# then install deploy/nginx.conf over this file.

server {
    listen      80;
    listen      [::]:80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

