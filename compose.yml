# compose.yml
#
#   cp .env.example .env   # then edit
#   docker compose up -d
#
# The container is NOT exposed to the internet directly: nginx on the host
# proxies to 127.0.0.1:8080 (see deploy/nginx.conf).

services:
  trade:
    image: interstellar-trade:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - trade-data:/data

    # Configuration is read from the environment by the binary itself.
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-}
      - REQUIRE_ADMIN_MFA=${REQUIRE_ADMIN_MFA:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Prometheus endpoint, reachable only on the compose network (not published).
      - METRICS_ADDR=:9090

    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

    # No shell/wget in a FROM scratch image: the binary probes /api/v1/readyz.
    healthcheck:
      test: ["CMD", "/interstellar-trade", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  trade-data:
    driver: local

